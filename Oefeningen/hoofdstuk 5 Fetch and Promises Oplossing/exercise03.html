<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Oefening 3 | Les 5 | JavaScript (Essentials)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
      #spinner:not([hidden]) {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 999;
      }

      #spinner::after {
          content: "";
          width: 180px;
          height: 180px;
          border: 4px solid #f3f3f3;
          border-top: 3px solid #f25a41;
          border-radius: 100%;
          will-change: transform;
          animation: spin 1s infinite linear;
      }

      @keyframes spin {
          from {
              transform: rotate(0deg);
          }

          to {
              transform: rotate(360deg);
          }
      }
  </style>
</head>
<body>

<div class="container">
  <h1>Lorem Picsum <small>The Lorem Ipsum for photos.</small></h1>

  <div id="spinner"></div>

  <div class="row" id="result" hidden></div>
</div>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<script>
  const spinner = document.getElementById('spinner')
  const results = document.getElementById('result')

  async function getImageURIs() {
    // Wacht 2 seconden zodat de spinner zichtbaar blijft en niet onmiddellijk verdwijnt.
    await new Promise(r => setTimeout(r, 2000))

    // We roepen de request op voor de 25 foto's
    const response = await fetch('https://picsum.photos/v2/list?limit=25')
    const images = await response.json()
    // We gebruiken de .filter om enkel de landscape foto's over te houden
    return images.filter(image => image.height < image.width)
  }

  async function displayImages() {
    const images = await getImageURIs()
    spinner.hidden = true

    for (const {author, download_url, height, width, url} of images) {
      results.innerHTML += `
            <div class="col-md-4">
                <div class="card mb-4 shadow-sm">
                    <img src="${download_url}" class="img-responsive">
                    <div class="card-body">
                        <p class="card-text">${author}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a href="${url}" target="_blank" class="btn btn-primary" role="button">Meer info</a>
                            </div>
                            <small class="text-muted">${height} x ${width}</small>
                        </div>
                    </div>
                </div>
            </div>`
    }

    results.hidden = false
  }

  displayImages()
</script>

</body>
</html>
