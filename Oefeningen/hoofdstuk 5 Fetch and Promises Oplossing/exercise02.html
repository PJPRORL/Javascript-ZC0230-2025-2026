<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Oefening 2 | Les 5 | JavaScript (Essentials)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<div class="container">
  <h1>Star Wars personages</h1>

  <div class="alert alert-danger d-none" role="alert" id="error-message">
  </div>

  <ul class="list-group" id="start-wars-characters">
    <!--<li class="list-group-item">An item</li>-->
  </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<script>
async function getStarWarsCharacters() {
  try {
    const response = await fetch('https://swapi.dev/api/people/');
    const data = await response.json();
    data.results.forEach(character => addCharacterToList(character));
  } catch (e) {
    const errorMessage = document.getElementById('error-message');
    errorMessage.classList.remove('d-none');
    errorMessage.textContent = 'Er is een fout opgetreden bij het ophalen van de data.';
  }
}

const list = document.getElementById('start-wars-characters');

function addCharacterToList(character) {
  const listItem = document.createElement('li');
  listItem.classList.add('list-group-item');
  listItem.textContent = `${character.name}${character.gender === 'n/a' ? '' : ' (' + character.gender + ')'}`;
  list.appendChild(listItem);
}

getStarWarsCharacters()
</script>

</body>
</html>
