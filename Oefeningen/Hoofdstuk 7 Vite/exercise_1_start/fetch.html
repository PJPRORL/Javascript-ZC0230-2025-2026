<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Voorbeeld 8 | Les 5 | JavaScript (Essentials)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<div class="container">
  <h1>Posts</h1>

  <div id="posts">

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<script>
  async function renderPosts() {
    // We gebruiken hier de gratis en fake jsonplaceholder API om te testen
    const result = await fetch('https://jsonplaceholder.typicode.com/posts');

    // Via de json() methode kunnen we de data omzetten naar een JavaScript object
    const posts = await result.json();

    const postContainer = document.getElementById('posts');
    posts.forEach(post => postContainer.appendChild(createPost(post)));
  }
  renderPosts()

  function createPost(post) {
    const postCard = document.createElement('div');
    postCard.classList.add('card', 'my-3');

    const postBody = document.createElement('div')
    postBody.classList.add('card-body');
    postCard.appendChild(postBody)

    const postTitle = document.createElement('h5');
    postTitle.classList.add('card-title');
    postTitle.textContent = post.title;
    postBody.appendChild(postTitle);

    const postContent = document.createElement('p');
    postContent.classList.add('card-text');
    postContent.textContent = post.body;
    postBody.appendChild(postContent);

    return postCard
  }
</script>

</body>
</html>
