<div class="container" id="home-page">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold text-dark">Choose Your Game</h1>
        <p class="lead text-muted">Select a classic to start playing against an AI.</p>
    </div>

    <div class="row justify-content-center g-4">
        <div class="col-md-5 col-lg-4">
            <div class="card h-100 game-card shadow-sm">
                <div class="svg-container">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <title>Connect Four</title>
                        <rect x="10" y="10" width="80" height="70" rx="5" fill="#007bff"/>
                        <circle cx="25" cy="25" r="8" fill="#ff4136"/>
                        <circle cx="42" cy="25" r="8" fill="#fff" opacity="0.3"/>
                        <circle cx="59" cy="25" r="8" fill="#fff" opacity="0.3"/>
                        <circle cx="76" cy="25" r="8" fill="#fff" opacity="0.3"/>
                        <circle cx="25" cy="45" r="8" fill="#ffdc00"/>
                        <circle cx="42" cy="45" r="8" fill="#ff4136"/>
                        <circle cx="59" cy="45" r="8" fill="#fff" opacity="0.3"/>
                        <circle cx="76" cy="45" r="8" fill="#fff" opacity="0.3"/>
                        <circle cx="25" cy="65" r="8" fill="#ffdc00"/>
                        <circle cx="42" cy="65" r="8" fill="#ffdc00"/>
                        <circle cx="59" cy="65" r="8" fill="#ff4136"/>
                        <circle cx="76" cy="65" r="8" fill="#fff" opacity="0.3"/>
                        <rect x="5" y="80" width="90" height="5" fill="#0056b3"/>
                    </svg>
                </div>
                <div class="card-body text-center">
                    <h3 class="card-title h4 fw-bold">Connect Four</h3>
                    <p class="card-text text-muted">Strategy and gravity. Be the first to line up four discs!</p>
                    <a href="#" class="btn btn-dark btn-lg w-100 mt-3" data-link="/connect-four">Play Now</a>
                </div>
            </div>
        </div>

        <div class="col-md-5 col-lg-4">
            <div class="card h-100 game-card shadow-sm">
                <div class="svg-container">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <title>Tic Tac Toe</title>
                        <line x1="35" y1="10" x2="35" y2="90" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                        <line x1="65" y1="10" x2="65" y2="90" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                        <line x1="10" y1="35" x2="90" y2="35" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                        <line x1="10" y1="65" x2="90" y2="65" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                        <line x1="15" y1="15" x2="28" y2="28" stroke="#ff4136" stroke-width="5" stroke-linecap="round"/>
                        <line x1="28" y1="15" x2="15" y2="28" stroke="#ff4136" stroke-width="5" stroke-linecap="round"/>
                        <circle cx="50" cy="50" r="8" fill="none" stroke="#007bff" stroke-width="5"/>
                        <line x1="72" y1="72" x2="85" y2="85" stroke="#ff4136" stroke-width="5" stroke-linecap="round"/>
                        <line x1="85" y1="72" x2="72" y2="85" stroke="#ff4136" stroke-width="5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="card-body text-center">
                    <h3 class="card-title h4 fw-bold">Tic Tac Toe</h3>
                    <p class="card-text text-muted">A quick battle of wits. Three in a row wins the game.</p>
                    <a href="#" class="btn btn-dark btn-lg w-100 mt-3" data-link="/tic-tac-toe">Play Now</a>
                </div>
            </div>
        </div>
    </div>
</div>
