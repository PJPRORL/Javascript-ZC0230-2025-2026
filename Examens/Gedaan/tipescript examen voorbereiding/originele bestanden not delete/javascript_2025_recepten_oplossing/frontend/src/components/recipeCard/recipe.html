<div class="card shadow-sm" style="width: 18rem">
  <div class="card-body">
    <div class="d-flex justify-content-between">
      <h5 class="card-title" id="name">Naam</h5>
      <button class="text-danger bg-body border-0" id="delete-recipe">
        &#128465;
      </button>
    </div>
    <h6 class="card-subtitle mb-2 text-muted">
      <span id="cuisine"></span> &middot; <span id="difficulty"></span> &middot; <span id="minutes"></span> min
    </h6>

    <div class="d-flex align-items-center gap-2 mb-2">
      <strong>Score:</strong>
      <button class="btn btn-sm btn-outline-secondary" id="rating-down">-</button>
      <span id="rating"></span>
      <button class="btn btn-sm btn-outline-secondary" id="rating-up">+</button>
    </div>

    <button class="btn btn-primary w-100" id="menu-button">+ Weekmenu</button>
  </div>
</div>
