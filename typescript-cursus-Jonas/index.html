<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Een complete, Nederlandstalige TypeScript cursus gebaseerd op het boek Learning TypeScript van Josh Goldberg. Leer TypeScript van nul tot gevorderd.">
  <title>TypeScript Cursus</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <!-- Highlight.js for code syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme-dark">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme-light" disabled>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/xml.min.js"></script>

  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- Mobile header -->
  <header class="mobile-header" id="mobile-header">
    <button class="hamburger" id="hamburger" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-title">🔷 TypeScript Cursus</span>
    <button class="theme-toggle" id="theme-toggle-mobile" aria-label="Wissel thema">
      <span class="theme-icon">☀️</span>
    </button>
  </header>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1 class="sidebar-title">🔷 TypeScript Cursus</h1>
      <button class="theme-toggle desktop-only" id="theme-toggle-desktop" aria-label="Wissel thema">
        <span class="theme-icon">☀️</span>
      </button>
    </div>

    <div class="sidebar-search">
      <input type="text" id="search-input" placeholder="Zoek een module..." aria-label="Zoek een module">
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <ul id="module-list">
        <!-- Dynamically populated by JS -->
      </ul>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="content" id="content">
    <div class="content-header">
      <button class="mark-read-btn" id="mark-read-btn">Markeer als gelezen</button>
    </div>
    <article class="content-body" id="content-body">
      <!-- Markdown content rendered here -->
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Module laden...</p>
      </div>
    </article>
  </main>

  <script src="index.js"></script>
</body>
</html>
